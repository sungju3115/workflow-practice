name: docker-build-push-ecr.yml

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
        # 소스코드 가져오기
        - name: Checkout
          uses: actions/checkout@v3

        # JDK 설정
        - name: Set up JDK 17
          uses: actions/setup-java@v3
          with:
            java-version: '17'
            distribution: 'temurin'

        # 권한 부여
        - name: Grant execute permission for gradlew
          run: chmod +x gradlew

        # 빌ㄷ
        - name: Build with Gradle
          run: ./gradlew clean bootJar

      # Configure AWS credentials
        - name: Configure AWS Credentials
          uses: aws-actions/configure-aws-credentials@v2
          with:
            aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
            aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            aws-region: ${{ secrets.AWS_REGION }}

        # ECR 로그인 (계정 ID를 Secret에서 참조)
        - name: ECR Login
          run: |
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} \
              | docker login --username AWS --password-stdin \
                ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

        # 도커 이미지 빌드, 도커 이미지 태그 변경(ECR 설정에 맞게), 도커 이미지 ECR 푸쉬
        # (선택) 이미지 태그 구성: 커밋 해시 7자리 + latest
        - name: Prepare tags
          id: prep
          run: |
            echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV
            echo "REPO_URI=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/repo-prac" >> $GITHUB_ENV

      # 4) Docker 빌드
        - name: Docker build
          run: |
            docker build -t "$REPO_URI:$IMAGE_TAG" -t "$REPO_URI:latest" .

      # 5) ECR 푸시
        - name: Docker push
          run: |
            docker push "$REPO_URI:$IMAGE_TAG"
            docker push "$REPO_URI:latest"